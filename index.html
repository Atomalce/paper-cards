<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸间卡片 · 先想一想，再翻开答案</title>
  <style>
    :root{--paper:#edf2f6;--white:#fffefb;--ink:#18364c;--muted:#657b8a;--line:#cad7df;--blue:#366987;--gold:#bb8444;--soft:#dfe9ef}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.65 'Microsoft YaHei','PingFang SC',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 15px}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}[hidden]{display:none!important}
    .wrap{max-width:1160px;margin:auto;padding:30px 30px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.logo{width:31px;height:35px;background:var(--ink);border-radius:3px 9px 3px 3px;box-shadow:5px 4px 0 #bbcad5;position:relative}.logo:after{content:'';position:absolute;left:8px;top:11px;width:15px;height:1px;background:#edf2f6;box-shadow:0 5px #edf2f6,0 10px #edf2f6}.brand b{font-size:23px;letter-spacing:3px}.brand small{font:10px ui-monospace,monospace;letter-spacing:3px;display:block;color:var(--muted)}.tools{display:flex;gap:8px}.tools button{font-size:12px;background:transparent}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:28px 0 22px}.intro h1{font:500 32px/1.5 'Songti SC','SimSun',serif;margin:0}.intro p{color:var(--muted);margin:5px 0 0;font-size:13px}.totals{text-align:right;white-space:nowrap;color:var(--muted);font-size:12px}.totals strong{font:28px ui-monospace,monospace;color:var(--ink)}progress{display:block;width:125px;height:5px;margin-top:8px;accent-color:var(--blue)}
    main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:27px;align-items:start}.practice-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.filters{display:flex;gap:3px}.filters button{border:0;background:transparent;padding:6px 11px;font-size:13px}.filters button[aria-pressed=true]{background:var(--ink);color:white}.position{font:12px ui-monospace,monospace;color:var(--muted)}.flashcard{width:100%;min-height:325px;padding:35px 38px;text-align:left;border:1px solid #c4d3dd;border-radius:15px;background:var(--white);box-shadow:6px 7px 0 #dce6ec;display:flex;flex-direction:column;position:relative}.flashcard:before{content:'';height:2px;width:32px;background:var(--gold);margin-bottom:23px}.face-label{font:11px ui-monospace,monospace;letter-spacing:3px;color:var(--muted)}.face-text{font:500 26px/1.7 'Songti SC','SimSun',serif;margin:19px 0 25px;white-space:pre-wrap;overflow-wrap:anywhere}.hint{margin-top:auto;font-size:12px;color:var(--muted)}.reveal{display:flex;gap:10px;margin-top:22px}.primary{background:var(--blue);border-color:var(--blue);color:white}.reveal button{flex:1}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:15px;font-size:12px;color:var(--muted)}.pager button{font-size:12px;background:transparent;border:0;padding:5px 0}.library{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:16px;margin:0}.search{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 3px;width:185px;font-size:12px;color:var(--ink)}.cards-list{list-style:none;padding:0;margin:0;max-height:260px;overflow:auto}.card-row{display:flex;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.card-row button{border:0;background:transparent;padding:3px 5px;font-size:12px}.card-row .question{flex:1;min-width:0;text-align:left;font-size:13px;overflow-wrap:anywhere}.status-dot{height:7px;width:7px;border-radius:50%;background:#a5b8c5;flex-shrink:0}.status-dot.known{background:var(--gold)}.empty-list{font-size:13px;color:var(--muted)}
    aside{background:#e3ecf2;border:1px solid var(--line);border-radius:13px;padding:24px}.form-title{font-size:18px;margin:0 0 3px}.form-desc{font-size:12px;color:var(--muted);margin:0 0 20px}label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}textarea{width:100%;resize:vertical;min-height:80px;border:1px solid #c5d4de;border-radius:8px;background:var(--white);padding:11px;color:var(--ink);line-height:1.7}#answer{min-height:135px}.form-actions{display:flex;gap:8px;margin-top:17px}.form-actions button{flex:1}.examples{margin-top:23px;padding-top:17px;border-top:1px solid #c9d7e0;color:var(--muted);font-size:12px}.examples button{font-size:12px;margin-top:10px;background:transparent}.note{font-size:11px;color:var(--muted);margin:15px 0 0}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.notice{padding:10px 15px;background:#fff5e6;border:1px solid #dec7a5;border-radius:8px;margin:18px 0;color:#75512f;font-size:13px}
    @media(max-width:760px){.wrap{padding:22px 17px}header{gap:10px}.brand b{font-size:19px}.tools button{padding:6px 8px}.intro{align-items:flex-start;margin-top:23px}.intro h1{font-size:25px}.intro p{max-width:250px}.totals strong{font-size:22px}progress{width:80px}main{grid-template-columns:1fr;gap:25px}.flashcard{min-height:295px;padding:28px}.face-text{font-size:23px}.search{width:150px}aside{padding:22px}.pager span{font-size:10px}footer{flex-direction:column;gap:5px}}
  </style>
</head>
<body><div class="wrap">
  <header><div class="brand"><span class="logo" aria-hidden="true"></span><div><b>纸间卡片</b><small>PAPER CARDS</small></div></div><div class="tools"><button id="export">导出备份</button><button id="import">导入卡片</button><input hidden id="file" type="file" accept=".json,application/json"></div></header>
  <div class="intro"><div><h1>先想一想，再翻开答案。</h1><p>把知识写成问题，让每一次翻面都成为一次回忆。</p></div><div class="totals"><strong id="known-count">0</strong> / <span id="total-count">0</span> 已熟悉<progress id="progress" max="1" value="0" aria-label="熟悉卡片比例"></progress></div></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <main><section aria-label="卡片练习"><div class="practice-tools"><div class="filters" aria-label="卡片筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="new" aria-pressed="false">待练习</button><button data-filter="known" aria-pressed="false">已熟悉</button></div><span id="position" class="position">0 / 0</span></div>
    <button id="flashcard" class="flashcard" aria-label="显示答案"><span id="face-label" class="face-label">QUESTION</span><span id="face-text" class="face-text">从一个好问题开始。</span><span id="hint" class="hint">在右侧写下问题和答案，或者载入三张示例卡片。</span></button>
    <div class="reveal"><button id="remember" class="primary" disabled>已经熟悉</button><button id="again" disabled>继续练习</button></div><div class="pager"><button id="prev" disabled>← 上一张</button><span>点击卡片翻面 · 标记由你自己决定</span><button id="next" disabled>下一张 →</button></div>
    <section class="library" aria-labelledby="library-title"><div class="section-head"><h2 id="library-title">我的卡片</h2><input id="search" class="search" type="search" aria-label="搜索卡片" placeholder="搜索问题或答案"></div><ul id="cards-list" class="cards-list"></ul><p id="empty-list" class="empty-list">这里还没有卡片。</p></section>
  </section>
  <aside><h2 id="form-title" class="form-title">写一张新卡片</h2><p class="form-desc">问题尽量具体，答案用自己的话表达。</p><form id="card-form"><label for="question">问题 · 最多200字</label><textarea id="question" required placeholder="这个概念的核心是什么？"></textarea><label for="answer">答案 · 最多2000字</label><textarea id="answer" required placeholder="写下清晰、可核对的答案……"></textarea><div class="form-actions"><button id="submit" class="primary" type="submit">保存卡片</button><button id="cancel" type="button" hidden>取消编辑</button></div></form><div class="examples">第一次使用？三张关于如何使用卡片的示例可以帮你开始。<br><button id="examples">载入示例卡片</button></div><p class="note">熟悉度是个人标记，不是考试成绩。<br>最多保存500张卡片，建议定期导出备份。</p></aside>
  </main><footer><span>卡片仅保存在当前浏览器。请在一个标签页中使用；更换设备请先导出。</span><span>无需登录 · 无运行时模型调用</span></footer>
</div><script src="core.js"></script><script src="app.js"></script></body></html>
